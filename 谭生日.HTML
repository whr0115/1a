<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日倒计时 - 从2012年4月21日开始</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        
        header {
            margin-bottom: 40px;
            animation: fadeInDown 1s ease;
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            font-size: 1.4rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
            animation: fadeInUp 1s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .birthday-info {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        
        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            width: 45%;
            min-width: 250px;
            margin: 10px;
            transition: transform 0.3s ease;
        }
        
        .info-box:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
        }
        
        .info-box h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .countdown {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        
        .countdown-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            min-width: 120px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .countdown-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .countdown-number {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .countdown-label {
            font-size: 1.1rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .progress-container {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff9a9e 0%, #fad0c4 100%);
            border-radius: 10px;
            width: 0;
            transition: width 1s ease;
        }
        
        .progress-text {
            margin-top: 15px;
            font-size: 1.1rem;
        }
        
        .cake-container {
            position: relative;
            margin: 50px auto;
            width: 200px;
            height: 200px;
            animation: float 4s ease-in-out infinite;
        }
        
        .cake {
            position: absolute;
            width: 150px;
            height: 80px;
            background: linear-gradient(to bottom, #f8d7da, #f5b6c1);
            border-radius: 50% 50% 0 0;
            bottom: 0;
            left: 25px;
        }
        
        .candle {
            position: absolute;
            width: 8px;
            height: 40px;
            background: #ffd166;
            border-radius: 4px;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .flame {
            position: absolute;
            width: 15px;
            height: 25px;
            background: linear-gradient(to bottom, #ff9e00, #ff5400, transparent 70%);
            border-radius: 50% 50% 20% 20%;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 1.5s infinite alternate;
        }
        
        footer {
            margin-top: 40px;
            font-size: 1.1rem;
            opacity: 0.8;
            animation: fadeIn 2s ease;
        }
        
        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        @keyframes flicker {
            0% { 
                transform: translateX(-50%) scale(1); 
                opacity: 1;
            }
            50% { 
                transform: translateX(-50%) scale(1.1); 
                opacity: 0.9;
            }
            100% { 
                transform: translateX(-50%) scale(0.9); 
                opacity: 0.8;
            }
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1.1rem; }
            .card { padding: 25px 15px; }
            .info-box { width: 100%; }
            .countdown-item { min-width: 80px; padding: 15px; }
            .countdown-number { font-size: 2.5rem; }
        }
        
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .countdown { gap: 10px; }
            .countdown-item { min-width: 70px; padding: 10px; }
            .countdown-number { font-size: 2rem; }
            .countdown-label { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-birthday-cake"></i> 生日倒计时</h1>
            <p class="subtitle">从2012年4月21日开始，记录每一个特别的日子</p>
        </header>
        
        <main>
            <div class="card">
                <div class="birthday-info">
                    <div class="info-box">
                        <h2><i class="fas fa-calendar-alt"></i> 起始日期</h2>
                        <p>2012年4月21日</p>
                    </div>
                    <div class="info-box">
                        <h2><i class="fas fa-user"></i> 生日主角</h2>
                        <p>谭艺菲</p>
                    </div>
                </div>
                
                <div class="cake-container">
                    <div class="cake"></div>
                    <div class="candle"></div>
                    <div class="flame"></div>
                </div>
                
                <div class="countdown">
                    <div class="countdown-item">
                        <div class="countdown-number" id="years">0</div>
                        <div class="countdown-label">年</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="days">0</div>
                        <div class="countdown-label">天</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="hours">0</div>
                        <div class="countdown-label">小时</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="minutes">0</div>
                        <div class="countdown-label">分钟</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="seconds">0</div>
                        <div class="countdown-label">秒</div>
                    </div>
                </div>
                
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="progress-text" id="progress-text">已经度过了 <span id="total-days">0</span> 天中的 <span id="days-passed">0</span> 天</div>
            </div>
        </main>
        
        <footer>
            <p>每一天都是新的开始，每一岁都是新的旅程 ❤️</p>
        </footer>
    </div>

    <script>
        // 设置起始日期 - 2012年4月21日
        const startDate = new Date('2012-04-21');
        
        // 更新倒计时函数
        function updateCountdown() {
            const now = new Date();
            
            // 计算总天数
            const diffTime = Math.abs(now - startDate);
            const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            // 计算下一个生日（4月21日）
            const currentYear = now.getFullYear();
            let nextBirthday = new Date(currentYear, 3, 21); // 月份是0-11，所以4月是3
            
            // 如果今年的生日已经过了，计算明年的生日
            if (now > nextBirthday) {
                nextBirthday = new Date(currentYear + 1, 3, 21);
            }
            
            // 计算距离下一个生日的时间
            const birthdayDiff = nextBirthday - now;
            const years = Math.floor(birthdayDiff / (1000 * 60 * 60 * 24 * 365));
            const days = Math.floor((birthdayDiff % (1000 * 60 * 60 * 24 * 365)) / (1000 * 60 * 60 * 24));
            const hours = Math.floor((birthdayDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((birthdayDiff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((birthdayDiff % (1000 * 60)) / 1000);
            
            // 更新显示
            document.getElementById('years').textContent = years;
            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
            document.getElementById('total-days').textContent = totalDays;
            document.getElementById('days-passed').textContent = totalDays;
            
            // 更新进度条（假设以100年为满进度）
            const progressPercentage = Math.min(100, (totalDays / 36525) * 100);
            document.getElementById('progress-bar').style.width = `${progressPercentage}%`;
        }
        
        // 初始调用
        updateCountdown();
        
        // 每秒更新一次
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的时光</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        /* 飘落的心形花瓣 */
        .petal {
            position: absolute;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23ff69b4" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>') no-repeat center center;
            background-size: contain;
            z-index: 2;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* 标题样式 */
        .title {
            font-size: 4rem;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff69b4, #ff8c00, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(255, 105, 180, 0.3); }
            to { text-shadow: 0 0 20px rgba(255, 105, 180, 0.6); }
        }

        /* 时间显示区域 */
        .time-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 20px;
            min-width: 400px;
            transition: all 0.3s ease;
        }

        .time-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .time-label {
            font-size: 1.5rem;
            color: #ff69b4;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .time-display {
            font-size: 2.5rem;
            color: #fff;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
        }

        .days {
            font-size: 4rem;
            color: #ff69b4;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }

        .start-date {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 15px;
        }

        /* 浪漫诗句 */
        .poem {
            margin-top: 30px;
            font-style: italic;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.8;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            
            .time-container {
                min-width: 300px;
                padding: 30px 20px;
            }
            
            .time-display {
                font-size: 2rem;
            }

            .days {
                font-size: 3rem;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 2rem;
            }
            
            .time-container {
                min-width: 280px;
                padding: 25px 15px;
            }
            
            .time-display {
                font-size: 1.8rem;
            }

            .days {
                font-size: 2.5rem;
            }
